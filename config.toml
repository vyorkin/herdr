onboarding = false

[ui.toast]
delivery = "herdr"

[theme]
name = "catppuccin"
# Follow the host terminal's light/dark appearance and switch Herdr's UI to
# match. Works both on macOS and on Linux terminals that report color-scheme
# (foot, Ghostty, kitty, ...), so this one config fits either OS. Terminals
# without light/dark reporting simply keep "catppuccin".
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

[terminal]
# "auto" starts login shells on macOS and keeps the platform default elsewhere,
# which is what each OS expects. default_shell stays unset so new panes use
# $SHELL (zsh on macOS, the user's login shell on Linux).
shell_mode = "auto"

[keys]
# Same prefix as tmux
prefix = "ctrl+space"

detach = "prefix+d"

# Splits: j = below, l = right (tmux: split-window -v / -h)
split_horizontal = "prefix+j"
split_vertical = "prefix+l"

# Killing pane/tab (tmux: x = kill-pane, q = kill-window)
close_pane = "prefix+x"
close_tab = "prefix+q"

# Maximize active pane (tmux: C-h resize-pane -Z)
zoom = "prefix+ctrl+h"

# Pane focus without prefix (alt instead of ctrl to not clash with nvim)
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"

# Pane cycling (tmux: prefix C-s) and back-and-forth (tmux: prefix Tab)
cycle_pane_next = "prefix+ctrl+s"
last_pane = "prefix+tab"

# Quick tab navigation (tmux: M-p / M-n)
previous_tab = "alt+p"
next_tab = "alt+n"

# Pane resize (tmux: prefix H/J/K/L)
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

# Navigate mode (prefix+w): j/k move workspace selection like a list;
# pane focus inside navigate mode moves to shift+j/k (h/l stay as-is)
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_down = "shift+j"
navigate_pane_up = "shift+k"

# prefix+shift+g is taken by lazygit below
new_worktree = "prefix+ctrl+g"

# Popup scratch terminal (tmux: M-t). Use the platform login shell rather than
# a hardcoded "zsh -l", so the binding works on macOS (zsh) and Linux ($SHELL).
[[keys.command]]
key = "alt+t"
type = "popup"
command = "exec \"${SHELL:-sh}\" -l"
width = "80%"
height = "80%"

# Lazygit popup (tmux: prefix G). Requires lazygit on PATH on both OSes
# (Homebrew on macOS, the distro package on Linux).
[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"
